<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ArNet Transceiver Web GUI</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="window" id="app">
        <!-- Top radio display -->
        <section
            class="border-box"
            style="height: 120px; padding: 8px;"
        >
            <div class="top-grid">
                <div
                    class="meter-container"
                    id="meterContainer"
                >
                    <canvas
                        id="canvasMeter"
                        width="200"
                        height="90"
                        style="
                            position: absolute;
                            left: 0;
                            top: 0;
                        "
                    ></canvas>
                </div>

                <div
                    style="
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        padding-left: 10px;
                    "
                >
                    <div
                        style="
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                        "
                    >
                        <div
                            style="
                                display: flex;
                                gap: 4px;
                            "
                        >
                            <select
                                id="comboMode"
                                style="
                                    width: 70px;
                                    height: 20px;
                                    background: #222;
                                    color: #FFCC00;
                                    font-weight: bold;
                                    font-size: 10px;
                                "
                            >
                                <option value="AARM" selected>
                                    AARM
                                </option>

                                <option value="ABM">
                                    ABM
                                </option>

                                <option value="ABMTV">
                                    ABMTV
                                </option>
                            </select>

                            <select
                                id="comboBand"
                                style="
                                    width: 105px;
                                    height: 20px;
                                    background: #222;
                                    color: #00FFFF;
                                    font-weight: bold;
                                    font-size: 10px;
                                "
                            ></select>

                            <div
                                id="boxTxState"
                                style="
                                    background: #330000;
                                    border-radius: 2px;
                                    padding: 1px 4px;
                                    display: flex;
                                    align-items: center;
                                    margin-left: 5px;
                                "
                            >
                                <span
                                    id="txtTxState"
                                    style="
                                        color: #FF3333;
                                        font-size: 11px;
                                        font-weight: bold;
                                    "
                                >
                                    RX
                                </span>
                            </div>
                        </div>

                        <span
                            id="txtClock"
                            style="
                                color: #888888;
                                font-size: 11px;
                            "
                        >
                            00:00:00
                        </span>
                    </div>

                    <div
                        style="
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            margin-top: 4px;
                        "
                    >
                        <input
                            id="txtFrequency"
                            type="text"
                            value="4550"
                            inputmode="numeric"
                            autocomplete="off"
                            style="
                                color: #00FFFF;
                                background: #0A0A0C;
                                border: 1px solid #005555;
                                font-size: 36px;
                                font-weight: bold;
                                text-align: right;
                                width: 160px;
                                height: 48px;
                            "
                        >

                        <span
                            style="
                                color: #00FFFF;
                                font-size: 20px;
                                font-weight: bold;
                                margin-left: 4px;
                                align-self: flex-end;
                                margin-bottom: 6px;
                            "
                        >
                            Vt
                        </span>
                    </div>
                </div>
            </div>
        </section>
<!-- Morse decoder display -->
<section
    class="border-box"
    style="
        margin-top: 8px;
        margin-bottom: 8px;
        padding: 7px;
    "
>
    <div
        style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        "
    >
        <span
            style="
                color: #FFCC00;
                font-size: 10px;
                font-weight: bold;
            "
        >
            MORSE SIGNAL DECODER
        </span>

        <button
            id="btnClearMorseDecode"
            type="button"
            style="
                background: #442200;
                color: #FFFFFF;
                font-size: 9px;
                font-weight: bold;
                cursor: pointer;
                padding: 3px 7px;
            "
        >
            CLEAR
        </button>
    </div>

    <div
        id="txtMorseDecode"
        style="
            min-height: 42px;
            max-height: 100px;
            overflow-y: auto;
            background: #080808;
            border: 1px solid #554400;
            color: #FFDD55;
            font-family: Consolas, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            padding: 7px;
            box-sizing: border-box;
        "
    >
        Waiting for Morse transmission...
    </div>

    <div
        id="txtMorseDecodeInfo"
        style="
            color: #888888;
            font-family: Consolas, monospace;
            font-size: 9px;
            margin-top: 4px;
        "
    >
        No Morse signal received.
    </div>
</section>

        <!-- Transmit and configuration controls -->
        <section
            class="controls-grid"
            style="margin-bottom: 8px;"
        >
            <div
                style="
                    display: flex;
                    flex-direction: column;
                    gap: 3px;
                "
            >
                <button
                    id="btnPtt"
                    type="button"
                    style="
                        height: 32px;
                        background: #880000;
                        color: white;
                        font-weight: bold;
                        font-size: 11px;
                        cursor: pointer;
                    "
                >
                    🎙️ PTT MIC
                </button>

                <button
                    id="btnLoadVideo"
                    type="button"
                    style="
                        height: 26px;
                        background: #005577;
                        color: #00FFFF;
                        font-weight: bold;
                        font-size: 10px;
                        cursor: pointer;
                    "
                >
                    📷 LOAD VIDEO / IMAGE
                </button>

                <div
                    style="
                        display: grid;
                        grid-template-columns: 1fr 65px;
                        gap: 4px;
                    "
                >
                    <input
                        id="txtCallsign"
                        type="text"
                        value="W1AW/1"
                        maxlength="7"
                        autocomplete="off"
                        style="
                            background: #111115;
                            color: #00FFCC;
                            border: 1px solid #333333;
                            font-weight: bold;
                            font-size: 11px;
                            text-align: center;
                            height: 26px;
                        "
                    >

                    <button
                        id="btnIdent"
                        type="button"
                        style="
                            background: #004466;
                            color: white;
                            font-weight: bold;
                            font-size: 10px;
                            cursor: pointer;
                        "
                    >
                        📡 IDENT
                    </button>
                </div>
<div
    style="
        display: grid;
        grid-template-columns: 1fr 80px;
        gap: 4px;
        margin-top: 3px;
    "
>
    <input
        id="txtMorseMessage"
        type="text"
        maxlength="120"
        placeholder="TYPE MORSE MESSAGE"
        autocomplete="off"
        style="
            background: #111115;
            color: #FFCC00;
            border: 1px solid #554400;
            font-family: Consolas, monospace;
            font-size: 10px;
            height: 26px;
            padding: 0 5px;
        "
    >

    <button
        id="btnSendMorse"
        type="button"
        style="
            background: #665000;
            color: white;
            font-weight: bold;
            font-size: 9px;
            cursor: pointer;
        "
    >
        📟 MORSE
    </button>
</div>
                <label
                    style="
                        display: flex;
                        align-items: center;
                        gap: 4px;
                        margin-top: 2px;
                        cursor: pointer;
                    "
                >
                    <input
                        type="checkbox"
                        id="chkUnencoded"
                    >

                    <span
                        style="
                            color: #AAAAAA;
                            font-size: 9px;
                        "
                    >
                        Unencoded Audio (Plain Morse)
                    </span>
                </label>
            </div>

            <div></div>

            <div
                class="border-box"
                style="
                    display: flex;
                    flex-direction: column;
                    justify-content: space-between;
                "
            >
                <div
                    style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                    "
                >
                    <span
                        style="
                            color: #AAAAAA;
                            font-size: 10px;
                            font-weight: bold;
                        "
                    >
                        CARRIER &amp; BANDWIDTH CONFIG
                    </span>

                    <div
                        style="
                            display: flex;
                            align-items: center;
                            gap: 4px;
                        "
                    >
                        <span
                            style="
                                color: #888888;
                                font-size: 9px;
                            "
                        >
                            BANDWIDTH:
                        </span>

                        <select
                            id="comboBandwidth"
                            style="
                                width: 105px;
                                height: 18px;
                                background: #111;
                                color: #00FFCC;
                                font-size: 9px;
                                font-weight: bold;
                            "
                        >
                            <option value="wide" selected>
                                Wide (2.8 kHz)
                            </option>

                            <option value="narrow">
                                Narrow (500 Hz)
                            </option>
                        </select>
                    </div>
                </div>

                <div
                    style="
                        display: flex;
                        flex-direction: column;
                        gap: 4px;
                    "
                >
                    <div
                        style="
                            display: flex;
                            justify-content: space-between;
                        "
                    >
                        <span
                            style="
                                color: #CCCCCC;
                                font-size: 11px;
                            "
                        >
                            Baseline Carrier Power:
                        </span>

                        <span
                            id="txtCarrierVal"
                            style="
                                color: #00FFFF;
                                font-weight: bold;
                                font-size: 11px;
                            "
                        >
                            20%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="sliderCarrier"
                        min="0"
                        max="0.5"
                        step="0.05"
                        value="0.1"
                        style="
                            width: 100%;
                            cursor: pointer;
                        "
                    >
                </div>
            </div>
        </section>

        <!-- Spectrum and waterfall display -->
        <section class="scope-grid">
            <div
                style="
                    height: 22px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                "
            >
                <div
                    style="
                        display: flex;
                        align-items: center;
                        gap: 10px;
                    "
                >
                    <span
                        id="lblScopeMode"
                        style="
                            color: #00FFFF;
                            font-size: 10px;
                            font-weight: bold;
                        "
                    >
                        SPECTRUM SCOPE
                    </span>

                    <button
                        id="btnToggleDisplay"
                        type="button"
                        style="
                            background: #003344;
                            color: #00FFCC;
                            font-size: 9px;
                            font-weight: bold;
                            padding: 2px 6px;
                            cursor: pointer;
                        "
                    >
                        🔄 SWITCH TO WATERFALL
                    </button>
                </div>

                <div
                    style="
                        display: flex;
                        gap: 8px;
                        font-size: 9px;
                    "
                >
                    <span style="color: #00FFFF;">
                        ■ Carrier
                    </span>

                    <span style="color: #FFFF00;">
                        ■ Audio
                    </span>

                    <span
                        id="txtVideoLegend"
                        style="
                            color: #FF00FF;
                            display: none;
                        "
                    >
                        ■ Video Subcarrier
                    </span>
                </div>
            </div>

            <div class="scope-screen">
                <canvas
                    id="canvasScope"
                    style="
                        width: 100%;
                        height: 100%;
                        display: block;
                    "
                ></canvas>

                <canvas
                    id="imgWaterfall"
                    style="
                        width: 100%;
                        height: 100%;
                        display: none;
                        image-rendering: pixelated;
                    "
                ></canvas>
            </div>
        </section>

        <!-- File controls and status -->
        <section class="bottom-grid">
            <div
                class="file-controls"
                style="
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    gap: 4px;
                    min-height: 35px;
                "
            >
                <button
                    id="btnLoad"
                    type="button"
                    style="
                        min-height: 35px;
                        background: #003366;
                        color: white;
                        font-weight: bold;
                        font-size: 10px;
                        opacity: 0.5;
                        cursor: not-allowed;
                    "
                    disabled
                >
                    📁 DECODE WAV
                </button>

                <button
                    id="btnLoadAMMEF"
                    type="button"
                    style="
                        min-height: 35px;
                        background: #224466;
                        color: white;
                        font-weight: bold;
                        font-size: 10px;
                        cursor: pointer;
                    "
                >
                    📂 LOAD AMMEF
                </button>

               <input
    id="fileTransmitAMMEF"
    type="file"
    accept=".ammef,application/x-ammef"
    hidden
>

<button
    id="btnTransmitAMMEF"
    type="button"
    style="
        background: #663300;
        color: white;
        font-weight: bold;
        font-size: 10px;
        cursor: pointer;
        padding: 7px;
    "
>
    📡 TRANSMIT AMMEF
</button>

                <input
    id="fileStreamAudio"
    type="file"
    accept="audio/*"
    hidden
>

<button
    id="btnPrepareStream"
    type="button"
>
    PREPARE AUDIO STREAM
</button>

<button
    id="btnStartStream"
    type="button"
    disabled
>
    TX STREAM
</button>

<button
    id="btnStopStream"
    type="button"
    disabled
>
    STOP STREAM
</button>
                
                <button
                    id="btnSave"
                    type="button"
                    style="
                        min-height: 35px;
                        background: #114422;
                        color: white;
                        font-weight: bold;
                        font-size: 10px;
                        opacity: 0.5;
                        cursor: not-allowed;
                    "
                    disabled
                >
                    💾 SAVE .AMMEF
                </button>
            </div>

            <div
                class="border-box"
                style="
                    padding: 4px 8px;
                    min-height: 35px;
                    display: flex;
                    align-items: center;
                "
            >
                <span
                    id="txtStatus"
                    style="
                        color: #888888;
                        font-size: 11px;
                    "
                >
                    STATUS: STANDBY. Press PTT, IDENT, load WAV, image, or AMMEF.
                </span>
            </div>
        </section>
    </main>

    <!--
        Scripts are loaded in dependency order.
        These files will be filled during the next steps.
    -->
    <script src="js/globals.js?v=2"></script>
    <script src="js/audio.js"></script>
    <script src="js/morse.js"></script>
    <script src="js/encoder.js"></script>
    <script src="js/decoder.js"></script>
    <script src="js/ammef.js"></script>
    <script src="js/stream.js?v=2"></script>
    <script src="js/streamPlayer.js?v=2"></script>
    <script src="js/video.js"></script>
    <script src="js/photo.js"></script>
    <script src="js/display.js?v=2"></script>
    <script src="js/network.js?v=4"></script>
    <script src="js/weatherService.js?v=6"></script>
<script src="js/wwvSpriteData.js?v=4"></script>
<script src="js/wwvAudio.js?v=4"></script>
<script src="js/timeservice.js?v=11"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
